plex:
  url: http://localhost:32400
  token: ""
  library_name: Music

lastfm:
  api_key: ""

mapping:
  threshold: 0.5
  model_name: all-MiniLM-L6-v2

processing:
  batch_size: 100
  workers: 4
  dry_run: false
  path_map_source: /data/music
  path_map_target: /music

lyrics:
  enabled: true
  weight: 0.15
  prefer_embedded: true
  lrclib_url: https://lrclib.net

database:
  sqlite_path: data/state.sqlite

bpm:
  enabled: true
  octave_resolution: true
  octave_min_strength: 0.85
  octave_max_delta: 0.15
  octave_min_ratio: 1.85
  octave_max_ratio: 2.15
  max_promoted_bpm: 190

# NOTE: Resonate includes built-in defaults for mood rules, acoustic mappings,
# genre exclusions, conflicts, and genre mood seeds in package data (src/resonate/data/).
# Any section or field specified under mood_rules below acts as an override on top of defaults.
mood_rules:
  max_moods: 5
  acoustic_threshold: 0.10
  acoustic_mood_thresholds:
    Romantic: 0.30
    Energetic: 0.30
    Lively: 0.30
    Happy: 0.20
    Upbeat: 0.20
  lyrics_threshold: 0.30
  lyrics_mood_thresholds:
    Happy: 0.30
    Upbeat: 0.30
    Romantic: 0.35
    Party: 0.35
    Dark: 0.35
    Melancholic: 0.35
    Rowdy: 0.35
    Heavy: 0.35
    Aggressive: 0.30

  acoustic_mood_mappings:
    Acoustic:
      - acoustic
      - soft
      - nature
      - slow
    Electronic:
      - space
      - deep
      - soundscape
    Rowdy:
      - energetic
      - action
      - powerful
      - party
      - heavy
      - fast
    Aggressive:
      - heavy
      - action
      - powerful
      - dark
    Lively:
      - energetic
      - happy
      - party
      - upbeat
      - fun
      - fast
    Funky:
      - groovy
    Soulful:
      - emotional
      - love
      - groovy
      - sad
    Hypnotic:
      - dream
      - space
      - atmospheric
      - deep
    Trippy:
      - dream
      - space
      - atmospheric
    Intimate:
      - romantic
      - love
      - soft
      - sexy
    Bittersweet:
      - sad
      - emotional
      - melancholic
    Moody:
      - dark
      - sad
      - emotional
      - melancholic
    Nostalgic:
      - retro
      - ballad
      - emotional
      - sad

  genre_exclusions:
    Aggressive:
      - Southern Rock
      - Blues Rock
      - Roots Rock
    Mellow:
      - Hard Rock
      - Heavy Metal
      - Metal
      - Punk
    Acoustic:
      - Hard Rock
      - Heavy Metal
      - Metal
    Chill Hang:
      - Jazz
      - Bebop
      - Hard Bop
      - Post-Bop
      - Punk
      - Pop-Punk
      - Punk Rock
      - Hardcore
      - Hardcore Punk
      - Metal
      - Heavy Metal
      - Thrash Metal
      - Death Metal
      - Black Metal
    Calm:
      - Hard Rock
      - Heavy Metal
      - Metal
      - Punk
    Relaxed:
      - Hard Rock
      - Heavy Metal
      - Metal
      - Punk
    Party:
      - Punk
      - Pop-Punk
      - Punk Rock
      - Skate Punk
      - Hardcore
      - Hardcore Punk
      - Metal
      - Heavy Metal
      - Thrash Metal
      - Death Metal
      - Black Metal
    Happy:
      - Metal
      - Heavy Metal
      - Thrash Metal
      - Death Metal
      - Black Metal
      - Doom Metal
      - Sludge Metal
      - Grindcore
      - Hardcore
      - Hardcore Punk
    Upbeat:
      - Metal
      - Heavy Metal
      - Thrash Metal
      - Death Metal
      - Black Metal
      - Doom Metal
      - Sludge Metal
      - Grindcore

  mood_conflicts:
    - if_present: [Acoustic, Mellow]
      drop: [Heavy, Aggressive, Rowdy]
    - if_present: [Heavy, Aggressive, Dark, Rowdy, Hardcore, Intense, Energetic]
      drop: [Calm, Relaxed, Mellow, Meditative, Romantic, Intimate, Groovy]
    - if_present: [Calm, Meditative, Relaxed, Mellow, Intimate]
      drop: [Heavy, Aggressive, Rowdy, Hardcore, Intense, Energetic, Lively]
    - if_present: [Heavy, Aggressive, Dark, Melancholic, Rowdy]
      drop: [Happy, Upbeat]
    - if_present: [Happy, Upbeat]
      drop: [Dark, Melancholic]
    - if_present: [Heavy, Aggressive, Rowdy, Ballad]
      drop: [Chill Hang]

  genre_mood_seeds:
    - genres: [Heavy Metal, Thrash Metal, Death Metal, Black Metal]
      moods: [Heavy, Aggressive, Intense]
    - genres: [Punk Rock, Skate Punk, Hardcore Punk, Alternative Punk, Post-Hardcore, Crossover Thrash]
      moods: [Rowdy, Aggressive]
    - genres: [Folk Punk, Celtic Punk]
      moods: [Rowdy, Lively]
    - genres: [Pop-Punk, Ska Punk, Rock and Roll, Ska]
      moods: [Rowdy, Upbeat]
    - genres: [Hard Rock, Sludge Metal, Doom Metal]
      moods: [Heavy]
    - genres: [Alternative Metal, Nu-Metal, Rap Metal, Industrial Metal]
      moods: [Heavy, Intense, Aggressive]
    - genres: [Speed Metal, Power Metal, Progressive Metal]
      moods: [Heavy, Intense, Energetic]
    - genres: [Alternative Rock, Indie Rock]
      moods: [Moody, Chill Hang]
    - genres: [Grunge, Stoner Rock]
      moods: [Heavy, Moody]
