[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resonate"
version = "0.1.0"
description = "Resonate Music Metadata Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "sentence-transformers>=2.2.0",
    "pylast>=5.0.0",
    "plexapi>=4.15.0",
    "essentia-tensorflow>=2.1b6.dev1110; sys_platform == 'linux'",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "mutagen>=1.46.0",
    "librosa>=0.10.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]
