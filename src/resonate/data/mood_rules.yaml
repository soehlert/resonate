mood_conflicts:
  - if_present: [Acoustic, Mellow]
    drop: [Heavy, Aggressive, Rowdy]
  - if_present: [Heavy, Aggressive, Dark, Rowdy, Hardcore, Intense]
    drop: [Calm, Relaxed, Mellow, Meditative, Intimate, Groovy]
  - if_present: [Energetic]
    drop: [Calm, Relaxed, Mellow, Meditative, Intimate]
  - if_present: [Heavy, Aggressive, Dark, Melancholic, Rowdy, Moody]
    drop: [Happy, Upbeat]
  - if_present: [Happy, Upbeat]
    drop: [Dark, Melancholic, Moody]
  - if_present: [Heavy, Aggressive, Rowdy, Ballad]
    drop: [Chill Hang]
  - if_present: [Calm, Meditative, Relaxed, Mellow, Intimate]
    drop: [Heavy, Aggressive, Rowdy, Hardcore, Intense, Energetic, Lively]

