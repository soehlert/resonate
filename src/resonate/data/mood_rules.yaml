mood_conflicts:
  - if_present: [Acoustic, Mellow]
    drop: [Heavy, Aggressive, Rowdy]
  - if_present: [Heavy, Aggressive, Dark, Rowdy, Hardcore, Intense, Energetic]
    drop: [Calm, Relaxed, Mellow, Meditative, Romantic, Groovy]
  - if_present: [Heavy, Aggressive, Dark, Melancholic, Rowdy]
    drop: [Happy, Upbeat]
  - if_present: [Happy, Upbeat]
    drop: [Dark, Melancholic]
  - if_present: [Heavy, Aggressive, Rowdy, Dark, Ballad]
    drop: [Chill Hang]
  - if_present: [Energetic]
    drop: [Lively]
  - if_present: [Calm, Meditative, Relaxed, Mellow]
    drop: [Heavy, Aggressive, Rowdy, Hardcore, Intense, Energetic, Lively]

